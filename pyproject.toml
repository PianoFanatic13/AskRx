[project]
name = "asrx"
version = "0.1.0"
requires-python = ">=3.11"
# Only what the deployed API (backend/api, backend/agent, backend/retrieval)
# actually imports at runtime - kept lean since Render's free tier caps at
# 512MB RAM. Ingestion and eval tooling live in the optional-dependencies
# groups below instead, since neither ever runs on the deployed instance.
dependencies = [
    "requests>=2.31",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain-ollama>=0.2",
    "langchain-google-genai>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# backend/pipeline (XML parsing, chunking) and backend/embedding (local BGE
# ingestion embedding) - only needed to run the ingestion pipeline locally,
# never on the deployed API.
ingestion = [
    "lxml>=5.0",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "tqdm>=4.66",
]
# backend/eval (RAGAS) - local-only, on-demand check per CLAUDE.md; no CI
# workflow runs it and it never runs on the deployed API.
eval = [
    "ragas>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.7",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits real external APIs — run with pytest -m integration",
    "db: requires a running Postgres+pgvector instance — run with pytest -m db",
]
