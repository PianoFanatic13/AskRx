name: API Integration

on:
  workflow_dispatch: {}

jobs:
  api-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asrx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asrx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asrx
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      LLM_BACKEND: gemini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema
        run: psql -h localhost -U postgres -d asrx -f db/schema.sql
        env:
          PGPASSWORD: postgres
      - run: pytest tests/test_api.py -m integration
